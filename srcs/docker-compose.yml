services:
  mariadb:
    build: ./requirements/mariadb 
    container_name: mariadb
    image: mariadb:v1.0
    restart: on-failure
    env_file: .env
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - inception

  wordpress:
    build: ./requirements/wordpress
    container_name: wordpress
    image: wordpress:v1.0
    restart: on-failure
    env_file: .env
    volumes:
      - wp_data:/var/www/html
    depends_on:
      - mariadb
    networks:
      - inception

  nginx:
    build: ./requirements/nginx
    container_name: nginx
    image: nginx:v1.0
    restart: on-failure
    ports:
      - "443:443"
    volumes:
      - wp_data:/var/www/html
    depends_on:
      - wordpress
    networks:
      - inception
    env_file: .env

volumes:
  db_data:
    name: db_data
    driver: local
    driver_opts:
      type: none
      device: /home/aelbouz/data/db_data
      o: bind
  wp_data:
    name: wp_data
    driver: local
    driver_opts:
      type: none
      device: /home/aelbouz/data/wp_data
      o: bind

networks:
  inception:
    name: inception
    driver: bridge